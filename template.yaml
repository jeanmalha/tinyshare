AWSTemplateFormatVersion: '2010-09-09'
Description: tinyshare — time-limited file sharing via S3 + CloudFront

Parameters:
  Domain:
    Type: String
    Description: Full subdomain for sharing (e.g. share.example.com)
  HostedZoneId:
    Type: String
    Description: Route 53 hosted zone ID
  BucketName:
    Type: String
    Description: S3 bucket name for shared files

Resources:

  AliasStore:
    Type: AWS::CloudFront::KeyValueStore
    Properties:
      Name: !Sub '${AWS::StackName}-aliases'
      Comment: Alias to share path mappings

  LambdaEdgeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: [lambda.amazonaws.com, edgelambda.amazonaws.com]
            Action: sts:AssumeRole
      Policies:
        - PolicyName: tinyshare-lambda-edge
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [cloudfront-keyvaluestore:GetKey, cloudfront-keyvaluestore:PutKey]
                Resource: !GetAtt AliasStore.Arn
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: 'arn:aws:logs:*:*:*'

  ShareBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-tier-1d
            Status: Enabled
            TagFilters:
              - Key: expiry-tier
                Value: 1d
            ExpirationInDays: 2
          - Id: expire-tier-7d
            Status: Enabled
            TagFilters:
              - Key: expiry-tier
                Value: 7d
            ExpirationInDays: 8
          - Id: expire-tier-30d
            Status: Enabled
            TagFilters:
              - Key: expiry-tier
                Value: 30d
            ExpirationInDays: 31
          - Id: expire-shares-fallback
            Status: Enabled
            ExpirationInDays: 35

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ShareBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub 'arn:aws:s3:::${ShareBucket}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  LogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub '${BucketName}-logs'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-logs
            Status: Enabled
            ExpirationInDays: 90

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # CloudFront Function: runs at every PoP on viewer-request.
  # Handles expiry, alias redirects, and download-limit gating (read-only KVS).
  ExpiryCheckFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-expiry-check'
      AutoPublish: true
      FunctionConfig:
        Comment: Validates share link expiry and resolves aliases
        Runtime: cloudfront-js-2.0
        KeyValueStoreAssociations:
          - KeyValueStoreARN: !GetAtt AliasStore.Arn
      FunctionCode: |
        import cf from 'cloudfront';
        const kvsHandle = cf.kvs();

        async function handler(event) {
            var uri = event.request.uri;
            var parts = uri.replace(/^\/+/, '').split('/');

            // Single segment that is not a 10-digit epoch → alias lookup
            if (parts.length === 1 && parts[0].length > 0 && !/^\d{10}$/.test(parts[0])) {
                try {
                    var target = await kvsHandle.get(parts[0]);
                    return { statusCode: 302, statusDescription: 'Found', headers: { 'location': { value: '/' + target }, 'cache-control': { value: 'no-store' } } };
                } catch (e) {
                    return { statusCode: 404, statusDescription: 'Not Found', headers: { 'content-type': { value: 'text/plain' } }, body: 'Not found' };
                }
            }

            if (parts.length < 2 || !/^\d{10}$/.test(parts[0])) {
                return { statusCode: 400, statusDescription: 'Bad Request', headers: { 'content-type': { value: 'text/plain' } }, body: 'Invalid link' };
            }
            if (Math.floor(Date.now() / 1000) > parseInt(parts[0], 10)) {
                return { statusCode: 410, statusDescription: 'Gone', headers: { 'content-type': { value: 'text/html' }, 'cache-control': { value: 'no-store' } }, body: '<!DOCTYPE html><html><head><title>Expired</title><style>body{font-family:system-ui;max-width:400px;margin:80px auto;text-align:center;color:#555}h1{color:#222}</style></head><body><h1>Link expired</h1><p>This share link is no longer valid.</p></body></html>' };
            }
            // Check download limit (dl: prefix in KVS)
            try {
                var dlCount = await kvsHandle.get('dl:' + parts[1]);
                if (parseInt(dlCount, 10) === 0) {
                    return { statusCode: 410, statusDescription: 'Gone', headers: { 'content-type': { value: 'text/html' }, 'cache-control': { value: 'no-store' } }, body: '<!DOCTYPE html><html><head><title>Link used</title><style>body{font-family:system-ui;max-width:400px;margin:80px auto;text-align:center;color:#555}h1{color:#222}</style></head><body><h1>Link already used</h1><p>This link has reached its download limit. Contact the sender to request a new one.</p></body></html>' };
                }
            } catch(e) { /* no limit set — proceed */ }
            return event.request;
        }

  # Lambda@Edge: runs at regional edge on origin-response (cache miss only).
  # Decrements the dl: counter in KVS after S3 serves a 200.
  # Limited-download files are uploaded with Cache-Control: no-store so every
  # request is a cache miss and this function fires on every download.
  DecrementFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt LambdaEdgeRole.Arn
      Timeout: 5
      MemorySize: 128
      Code:
        ZipFile: !Sub |
          'use strict';
          const h=require('https'),c=require('crypto');
          const A='${AliasStore.Arn}';
          const HOST='cloudfront-keyvaluestore.amazonaws.com';
          const hm=(k,v)=>c.createHmac('sha256',k).update(v).digest();
          const sh=(v)=>c.createHash('sha256').update(v).digest('hex');
          function kvsReq(method,key,body,etag){
            return new Promise((res,rej)=>{
              const ak=process.env.AWS_ACCESS_KEY_ID,secret=process.env.AWS_SECRET_ACCESS_KEY,st=process.env.AWS_SESSION_TOKEN;
              const now=new Date().toISOString();
              const d=now.slice(0,10).replace(/-/g,''),t=now.replace(/[-:.Z]/g,'').slice(0,15)+'Z';
              const upath='/key-value-stores/'+encodeURIComponent(A)+'/keys/'+encodeURIComponent(key);
              const payload=body||'';
              const ph=sh(payload);
              const hdrs={'host':HOST,'x-amz-content-sha256':ph,'x-amz-date':t};
              if(st)hdrs['x-amz-security-token']=st;
              if(etag)hdrs['if-match']=etag;
              if(body){hdrs['content-type']='application/json';hdrs['content-length']=''+Buffer.byteLength(payload);}
              const hk=Object.keys(hdrs).sort();
              const cr=[method,upath,'',hk.map(k=>k+':'+hdrs[k]).join('\n'),'',hk.join(';'),ph].join('\n');
              const scope=d+'/us-east-1/cloudfront-keyvaluestore/aws4_request';
              const sts=['AWS4-HMAC-SHA256',t,scope,sh(cr)].join('\n');
              const sk=hm(hm(hm(hm('AWS4'+secret,d),'us-east-1'),'cloudfront-keyvaluestore'),'aws4_request');
              hdrs.authorization='AWS4-HMAC-SHA256 Credential='+ak+'/'+scope+', SignedHeaders='+hk.join(';')+', Signature='+c.createHmac('sha256',sk).update(sts).digest('hex');
              const req=h.request({hostname:HOST,path:upath,method,headers:hdrs},r=>{
                let data='';r.on('data',x=>data+=x);r.on('end',()=>res({s:r.statusCode,e:r.headers.etag,b:data}));
              });
              req.on('error',rej);if(payload)req.write(payload);req.end();
            });
          }
          exports.handler=async(event)=>{
            const{request:q,response:r}=event.Records[0].cf;
            if(r.status!=='200')return r;
            const p=q.uri.replace(/^\/+/,'').split('/');
            if(p.length<2||!/^\d{10}$/.test(p[0])||!/^[A-Za-z0-9]{8}$/.test(p[1]))return r;
            try{
              const k='dl:'+p[1];
              const g=await kvsReq('GET',k);
              if(g.s!==200)return r;
              const n=parseInt(JSON.parse(g.b).Value,10);
              if(isNaN(n)||n<=0)return r;
              await kvsReq('PUT',k,JSON.stringify({Value:''+Math.max(0,n-1)}),g.e);
            }catch(e){}
            return r;
          };

  DecrementVersion:
    Type: AWS::Lambda::Version
    DeletionPolicy: Retain
    Properties:
      FunctionName: !Ref DecrementFunction

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref Domain
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref Domain
          HostedZoneId: !Ref HostedZoneId

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: tinyshare
        Aliases:
          - !Ref Domain
        Origins:
          - Id: s3-tinyshare
            DomainName: !Sub '${BucketName}.s3.${AWS::Region}.amazonaws.com'
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
        DefaultCacheBehavior:
          TargetOriginId: s3-tinyshare
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ExpiryCheckFunction.FunctionARN
          LambdaFunctionAssociations:
            - EventType: origin-response
              LambdaFunctionARN: !Ref DecrementVersion
        HttpVersion: http2and3
        IPV6Enabled: true
        Logging:
          Bucket: !GetAtt LogBucket.DomainName
          Prefix: 'cf/'
          IncludeCookies: false
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref Domain
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

Outputs:
  BucketName:
    Value: !Ref ShareBucket
  LogBucketName:
    Value: !Ref LogBucket
  DistributionId:
    Value: !Ref Distribution
  ShareUrl:
    Value: !Sub 'https://${Domain}'
  KeyValueStoreArn:
    Value: !GetAtt AliasStore.Arn
